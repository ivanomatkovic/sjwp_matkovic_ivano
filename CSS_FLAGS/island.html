<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zastava</title>
    <style>
      .plavo {
        height: 500px;
        width: 650px;
        background-color: blue;
        position: relative;
      }
      .bijelo1 {
        width: 150px;
        height: 500px;
        background-color: white;
        position: absolute;
        left: 200px;
      }
      .bijelo2 {
        width: 650px;
        height: 200px;
        background-color: white;
        position: absolute;
        top: 150px;
      }
      .crveno1 {
        width: 50px;
        height: 500px;
        background-color: red;
        position: absolute;
        left: 200px;
      }
      .crveno2 {
        width: 650px;
        height: 150px;
        background-color: red;
        position: absolute;
        top: 200px;
      }
    </style>
  </head>
  <body>
    <div class="plavo">
      <div class="bijelo1"></div>
      <div class="bijelo2"></div>
      <div class="crveno1"></div>
      <div class="crveno2"></div>
    </div>
  </body>
</html>
