<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zastava</title>
    <style>
      .Plavo {
        width: 500px;
        height: 350px;
        background-color: blue;
        position: relative;
      }
      .crveno1 {
        width: 500px;
        height: 100px;
        background-color: red;
        position: absolute;
      }
      .crveno2 {
        width: 500px;
        height: 100px;
        background-color: red;
        position: absolute;
        top: 250px;
      }
      .krug {
        position: absolute;
        width: 125px;
        height: 125px;
        background-color: white;
        border-radius: 50%;
        top: 110px;
        right: 175px;
      }
    </style>
  </head>
  <body>
    <div class="Plavo">
      <div class="crveno1"></div>
      <div class="crveno2"></div>
      <div class="krug"></div>
    </div>
  </body>
</html>
