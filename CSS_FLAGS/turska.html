<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .zvijezda {
        width: 150px;
        height: 150px;
        background-color: red;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        transform: rotate(-20deg);
        background-color: white;
        position: absolute;
        right: 300px;
        top: 150px;
      }
      .red {
        width: 500px;
        height: 350px;
        background-color: red;
        position: relative;
      }
      .krug1 {
        position: absolute;
        width: 125px;
        height: 125px;
        background-color: white;
        border-radius: 50%;
        top: 110px;
        right: 175px;
      }
    </style>
  </head>
  <body>
    <div class="red">
      <div class="krug1"></div>
      <div class="krug2"></div>
      <div class="zvijezda"></div>
    </div>
  </body>
</html>
