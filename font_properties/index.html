<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Properties</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      body {
        background-color: cornflowerblue;
        color: white;
        font-size: 18px;
      }
      #color1 {
        color: coral;
      }
      #rem {
        font-size: 2rem;
      }
      #size1 {
        font-weight: 900;
      }
      #font1 {
        font-family: "Caveat", cursive;
      }
      #align1 {
        text-align: right;
      }

      /* Don't change the CSS above, add Your CSS below */
    </style>
  </head>

  <body>
    <h1>Important CSS Properties</h1>
    <p id="color1">Color</p>
    <p id="rem">Font Size</p>
    <p id="size1">Font Weight</p>
    <p id="font1">Font Family</p>
    <p id="align1">Text Align</p>
