<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: burlywood">
    <h1 style="text-align: center">Student Registration Form</h1>
    <form action="#"></form>
    <label for="text">Roll no. :</label>
      <input
        type="text"
        id="text""
        size="45"
      />
      <label for="name">Student name:</label>
      <input type="text" id="name" placeholder="First name" size="15" />
      <label for="name1">-</label>
      <input type="text" id="name1"placeholder="Last name"size="15"> <br>
      <label for="name2">Fathers name:</label>
      <input type="text"id="name2"size="15"lenght="45"> <br>
      <label for="date">Date of birth</label>
      <input type="date" name="date" id="date"placeholder="day,month,year" /> <br />
      
      <label for="tel">Mobile no. :</label>
      <input type="number" name="tel" id="tel" value="+91" size="2"> - <input type="tel"id="tel"> <br>
      <label for="mail">Email id:</label>
      <input type="email" name="mail" id="mail"> <br>
      <label for="pass">Password:</label>
      <input type="password" name="pass" id="pass">
      <p>Gender:</p>
      <input type="radio" name="spol" id="Male" />
      <label for="Female">Male</label> 
      <input type="radio" name="spol" id="Female" />
      <label for="Male">Female</label> 

       <p>Department:</p>
      <input type="checkbox" name="d1" id="CSE" />
      <label for="CSE">CSE</label> 
      <input type="checkbox" name="d2" id="IT" />
      <label for="IT">IT</label> 
      <input type="checkbox" name="d3" id="ECE" />
      <label for="ECE">ECE</label> 
      <input type="checkbox" name="d4" id="Civil" />
      <label for="Civil">Civil</label>
      <input type="checkbox" name="d5" id="Mech" />
      <label for="Mech">Mech</label> 
      <label for="course1">Course</label>
      <select name="course1" id="course">
        <option value="course1">---------Select current course-------</option>
        <option value="tehnicar">Tehnicar za racunalstvo</option>
        <option value="strojar">Tehnicar za strojarstvo</option>      
      </select>
      <br>

      <label for="file">Student photo:</label>
      <input type="file" name="file" id="file" /> <br />

      <label for="city">City:</label>
      <input type="city" id="city"  size="15" /> <br>

      <label for="address">Address:</label>
      <input type="address" id="address"size="15" width="50px"  />
  </body>
</html>
